[project]
name = "mcp-home"
version = "0.1.0"
description = "Smart lighting control (Tuya, local LAN) per household, as an MCP server — runs inside the home network."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Kuba" }]
dependencies = [
    "jarvis-mcp-kit @ git+https://github.com/jaknow01/jarvis-mcp-kit.git@v0.2.0",
    "tinytuya>=1.17.4,<2",
    "pydantic>=2",
]

[project.scripts]
mcp-home = "mcp_home.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_home"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
